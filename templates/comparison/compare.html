{% extends "base.html" %}

{% block title %}Compare Branches — College Predictor{% endblock %}

{% block main_class %}narrow{% endblock %}

{% block content %}

<div class="page-header">
    <p class="eyebrow">Branch comparison</p>
    <h1>Compare two branches</h1>
    <p>See average package, placement rate, fees and NIRF rank side by side.</p>
</div>

<div class="form-card">
    <form action="{{ url_for('comparison.compare_result') }}">

        <div class="field">
            <label for="branch1">First branch</label>
            <select id="branch1" name="branch1">
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.college.name }} — {{ branch.branch_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="branch2">Second branch</label>
            <select id="branch2" name="branch2">
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.college.name }} — {{ branch.branch_name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Compare</button>

    </form>
</div>

{% endblock %}
